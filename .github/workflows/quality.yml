name: MindCare Transformer checks
on:
  push:
    branches: [main, 'codex/**', 'fix/**', 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend config model preprocessing response scripts tests utils
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify exported Transformer numerics
        run: python -m scripts.export_browser_model --output /tmp/verified-export
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-production.cjs
