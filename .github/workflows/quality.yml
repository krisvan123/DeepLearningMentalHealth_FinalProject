name: MindCare quality checks

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.23,<3" "fastapi>=0.100" "pydantic>=2"
      - name: Python syntax checks
        run: python -m compileall -q backend config model preprocessing response scripts tests utils
      - name: Behavior and unit tests (model artifacts need TensorFlow for full inference)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test conversational greetings and mixed-context messages
        run: node scripts/test-conversation-intents.cjs
      - name: Test guided coping responses and context
        run: node scripts/test-guided-support.cjs
      - name: Test comprehensive bilingual conversational routing
        run: node scripts/test-conversation-engine.cjs
      - name: Test six real-user demo regressions and chat layout
        run: node scripts/test-demo-readiness.cjs
      - name: Verify model analysis and dataset-evidence pages
        run: node scripts/test-research-pages.cjs
      - run: npm run build
      - name: Smoke test production routes
        run: node scripts/smoke-production.cjs

  report-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PDF tool
        run: python -m pip install reportlab==4.4.9
      - name: Build marked PDF draft
        run: python -m scripts.export_report_draft --output MindCare_Report_DRAFT.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: MindCare-Report-DRAFT
          path: MindCare_Report_DRAFT.pdf
          retention-days: 14
