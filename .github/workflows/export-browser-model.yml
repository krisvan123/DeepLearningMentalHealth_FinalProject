name: Verify Transformer browser export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['models/transformer/**', 'scripts/export_browser_model.py']
permissions:
  contents: read
jobs:
  export-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.export_browser_model
      - uses: actions/upload-artifact@v4
        with:
          name: verified-transformer-browser-assets
          path: frontend/public/models/mindcare-transformer
